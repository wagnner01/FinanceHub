name: Eleições — boletins de urna e projeção da apuração

# Soma os Boletins de Urna de todas as seções do exterior (por cidade/país) e de uma amostra
# nacional estratificada por UF, que estima o 2º turno antes da totalização (variação seção a seção),
# e projeta o resultado final pela parcial por município (modelo de swing com encolhimento hierárquico).
# Agendamentos só rodam no branch padrão; na noite da eleição, dispare com loop_minutos > 0:
# o job repete a coleta (cada volta leva alguns minutos) e faz commit a cada volta.
on:
  schedule:
    # Noite do 2º turno (25/10, 17h–23h40 BRT = 20h–02h40 UTC): a cada 20 min
    - cron: '5,25,45 20-23 25 10 *'
    - cron: '5,25,45 0-2 26 10 *'
  workflow_dispatch:
    inputs:
      turno:
        description: 'Turno do exterior (vazio = todos os disponíveis)'
        type: string
        default: ''
      loop_minutos:
        description: 'Repetir a coleta por N minutos (0 = uma vez; máx. ~340)'
        type: string
        default: '0'
  push:
    branches: [main, ccr-98653d89-r5ar8b]
    paths: ['scripts/eleicoes/sync-bu-*.mjs', 'scripts/eleicoes/sync-projecao.mjs', 'scripts/eleicoes/sync-2022-exterior.mjs', 'js/eleicoes/bu.js', 'js/eleicoes/amostra.js', 'js/eleicoes/modelo-apuracao.js', '.github/workflows/eleicoes-bu.yml']

permissions:
  contents: write

concurrency:
  group: eleicoes-bu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Somar boletins de urna (exterior + amostra nacional)
        env:
          TURNO: ${{ inputs.turno }}
          LOOP: ${{ inputs.loop_minutos || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"
          FIM=$(( $(date +%s) + LOOP * 60 ))
          if [ ! -f data/eleicoes/2022/exterior.json ]; then
            # Dados abertos do TSE: votação por seção do exterior; senão, o arquivo nacional por município/zona
            ODS=https://cdn.tse.jus.br/estatistica/sead/odsele
            for url in $ODS/votacao_secao/votacao_secao_2022_ZZ.zip $ODS/votacao_candidato_munzona/votacao_candidato_munzona_2022.zip; do
              rm -rf /tmp/zz2022; echo "2022: tentando $url"
              curl -sSfL --max-time 300 -o /tmp/zz2022.zip "$url" || continue
              unzip -l /tmp/zz2022.zip | head -40
              mkdir -p /tmp/zz2022
              # Arquivo próprio do exterior (ZZ) ou só as linhas do exterior no arquivo nacional (BRASIL)
              unzip -qo -d /tmp/zz2022 /tmp/zz2022.zip '*ZZ*.csv' 2>/dev/null \
                || unzip -p /tmp/zz2022.zip '*BRASIL*.csv' | awk 'NR==1 || /;"ZZ";/' > /tmp/zz2022/votacao_ZZ.csv
              node scripts/eleicoes/sync-2022-exterior.mjs /tmp/zz2022 && [ -f data/eleicoes/2022/exterior.json ] && break
            done || echo "2022 exterior falhou"
          fi
          while :; do
            node scripts/eleicoes/sync-bu-exterior.mjs ${TURNO:+--turno $TURNO} || echo "exterior falhou"
            node scripts/eleicoes/sync-bu-amostra.mjs || echo "amostra falhou"
            node scripts/eleicoes/sync-projecao.mjs || echo "projeção falhou"
            git add data/eleicoes
            if ! git diff --cached --quiet; then
              git commit -q -m "data: boletins de urna $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
              ok=0
              for i in 1 2 3; do git pull --rebase -X theirs -q origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done
              # Conflito: vale o dado desta volta (-X theirs = o commit local no rebase); se ainda falhar,
              # descarta a volta local (os BUs voltam do repositório na próxima)
              [ "$ok" = 1 ] || { git fetch -q origin "$BRANCH"; git reset -q --hard "origin/$BRANCH"; }
            fi
            [ "$(date +%s)" -ge "$FIM" ] && break
            sleep 60
          done
